  <style>
    :root {
      --brand: #9f51f0;
      --ink: #1a1520;
      --muted: #5c5664;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #efe6ff 0%, #f7f5fb 40%, #ffffff 100%);
    }

    .page {
      max-width: 420px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 2rem;
      text-align: center;
    }

    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #fff;
      box-shadow: 0 8px 24px rgba(159, 81, 240, 0.25);
    }

    h1 {
      margin: 1rem 0 0.25rem;
      font-size: 1.35rem;
    }

    .handle {
      margin: 0 0 1rem;
      color: var(--brand);
      font-weight: 600;
      font-size: 0.92rem;
    }

    .greet {
      margin: 0 0 1.5rem;
      color: var(--muted);
      line-height: 1.75;
      font-size: 0.95rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .links a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      min-height: 52px;
      padding: 0.75rem 1rem;
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
      box-shadow: 0 6px 16px rgba(22, 19, 26, 0.06);
      border: 1px solid #ece8f2;
    }

    .links a i { width: 1.15rem; text-align: center; }

    .links a:hover {
      transform: translateY(-1px);
      border-color: var(--brand);
      color: var(--brand);
    }

    .links a.call {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }

    .links a.call:hover { color: #fff; filter: brightness(0.95); }

    .links a.wa { color: #128c7e; }
    .links a.wa:hover { color: #075e54; }

    footer {
      margin-top: 2rem;
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
